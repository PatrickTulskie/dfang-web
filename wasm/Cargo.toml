[package]
name = "dfang-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dfang = { git = "https://github.com/PatrickTulskie/dfang" }
rfang = { git = "https://github.com/PatrickTulskie/dfang" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
